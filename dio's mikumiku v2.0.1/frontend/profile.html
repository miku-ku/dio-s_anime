<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">Dio's mikumiku</a>
    <div class="nav-links" id="nav-links">
      <!-- 由 JS 根据登录状态渲染 -->
    </div>
  </nav>

  <main>
    <!-- 加载中（init 完成前显示，避免白屏） -->
    <div class="loading-tip" id="page-loading">加载中…</div>

    <!-- 加载失败（网络异常时显示，保留 token 供重试） -->
    <div class="card" id="error-view">
      <h1>加载失败</h1>
      <p class="subtitle">网络异常，无法加载用户信息，请检查网络后重试</p>
      <button class="btn" id="retry-btn">重试</button>
    </div>

    <!-- 未登录状态 -->
    <div class="card" id="guest-view">
      <h1>ciallo~</h1>
      <p class="subtitle">登录后即可拥有你的个人主页</p>
      <div class="guest-actions">
        <a class="btn btn-link" href="login.html">去登录</a>
        <a class="btn btn-secondary btn-link" href="register.html">注册新账号</a>
      </div>
    </div>

    <!-- 已登录状态：左侧设置 + 中间简介 -->
    <div class="profile-layout" id="user-view">
      <!-- 左栏：个人信息与账号设置 -->
      <aside class="card sidebar">
        <div class="sidebar-profile">
          <img id="avatar-img" class="avatar-img" alt="头像" />
          <div class="avatar" id="avatar">?</div>
          <div class="username" id="username">…</div>
          <div class="meta" id="meta"></div>
        </div>

        <hr />

        <div class="message" id="side-message"></div>

        <div class="section">
          <h3 class="section-title">更换头像</h3>
          <input type="file" id="avatar-input"
                 accept="image/png,image/jpeg,image/gif,image/webp" />
          <button class="btn btn-secondary" id="choose-avatar-btn">选择新头像</button>
          <p class="hint">支持 JPG / PNG / GIF / WebP，不超过 2MB</p>
        </div>

        <hr />

        <form id="password-form">
          <h3 class="section-title">修改密码</h3>
          <div class="form-group">
            <label for="old-password">原密码</label>
            <input type="password" id="old-password" autocomplete="current-password" required />
          </div>
          <div class="form-group">
            <label for="new-password">新密码</label>
            <input type="password" id="new-password" autocomplete="new-password" placeholder="至少 6 位" required />
          </div>
          <div class="form-group">
            <label for="confirm-password">确认新密码</label>
            <input type="password" id="confirm-password" autocomplete="new-password" required />
          </div>
          <button type="submit" class="btn" id="password-btn">修改密码</button>
        </form>

        <hr />

        <button class="btn btn-secondary" id="logout-btn">退出登录</button>
      </aside>

      <!-- 中间：个人简介 -->
      <section class="card content">
        <div class="content-header">
          <h2>个人简介</h2>
          <button class="btn-edit" id="edit-bio-btn">✎ 修改</button>
        </div>
        <div class="message" id="message"></div>
        <div class="bio empty" id="bio-text"></div>
      </section>
    </div>
  </main>

  <!-- 修改简介弹窗 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3>修改个人简介</h3>
        <button class="modal-close" id="modal-close" title="关闭">×</button>
      </div>
      <textarea id="bio-input" maxlength="200" placeholder="介绍一下你自己吧…"></textarea>
      <div class="modal-footer">
        <span class="char-count" id="char-count">0/200</span>
        <div>
          <button class="btn btn-secondary modal-btn" id="bio-cancel">取消</button>
          <button class="btn modal-btn" id="bio-save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
