<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">MySite</a>
    <div class="nav-links" id="nav-links"><!-- JS 按登录态渲染 --></div>
  </nav>

  <main>
    <div class="card">
      <h1>创建账号</h1>
      <p class="subtitle">注册后即可登录体验</p>

      <div class="message" id="message"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 placeholder="3-20 位字母 / 数字 / 下划线 / 中文" required />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
                 placeholder="至少 6 位" required />
        </div>
        <div class="form-group">
          <label for="confirm">确认密码</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password"
                 placeholder="再次输入密码" required />
        </div>
        <div class="form-group remember-group">
          <label class="checkbox">
            <input type="checkbox" id="remember" name="remember" />
            记住我（30 天内免登录）
          </label>
        </div>
        <button type="submit" class="btn" id="submit-btn">注册</button>
      </form>

      <p class="switch-link">已有账号？<a href="login.html">直接登录</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
